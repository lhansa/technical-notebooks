name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "posts/**/*.qmd"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Este PR añade o cambia posts del blog. Son prosa en ficheros .qmd, no código.

            Haz la auditoría de voz: lee CLAUDE.md entero y sigue las instrucciones de
            .claude/agents/oido.md, aplicándolas a los .qmd que toca este PR.

            Si el PR trae bloques de código ejecutado, comprueba además lo que pide la
            sección "Código" de CLAUDE.md: semilla fijada, bloques etiquetados, librerías
            dentro de requirements.txt.

            Deja los hallazgos como comentarios inline, cada uno con la regla que rompe y
            la reescritura propuesta. No comentes lo que esté bien. Si no hay nada que
            señalar, no comentes nada.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
